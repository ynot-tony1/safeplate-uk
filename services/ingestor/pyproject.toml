[project]
name = "ingestor"
version = "0.1.0"
description = "SafePlate UK — FSA FHRS/FHIS open-data ingestion service"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]==3.3.4",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "typer==0.27.0",
    "tenacity==9.1.4",
    "defusedxml==0.7.1",
    "structlog==26.1.0",
]

[project.scripts]
ingestor = "ingestor.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestor"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.0",
    "mypy==2.3.0",
]

[tool.ruff]
line-length = 115
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["ingestor"]

[tool.mypy]
python_version = "3.12"
strict = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
files = ["src"]

[[tool.mypy.overrides]]
module = "defusedxml.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

name: Apply Production Migrations

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm you want to run prisma migrate deploy against production'
        type: string
        required: true

concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    name: prisma migrate deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Confirm intent
        run: |
          if [ "${{ inputs.confirm }}" != "deploy" ]; then
            echo "Confirmation input did not match 'deploy'. Aborting without running migrations."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      # ONE-TIME RECOVERY: earlier attempts (before the real root cause —
      # CockroachDB's create_table_with_schema_locked default — was found
      # and verified) left this migration marked failed. No real data
      # exists yet, so drop any partial objects and clear the failed state
      # before the now-verified migration reapplies below. Remove once run.
      - name: TEMP RECOVERY clear failed migration state
        working-directory: packages/database
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: |
          cat > ./recovery.mjs <<'EOF'
          import { PrismaClient } from "./generated/client/index.js";
          const prisma = new PrismaClient();
          const tables = [
            "rating_changes",
            "establishments",
            "daily_metrics",
            "ingestion_runs",
            "local_authorities",
            "business_types",
          ];
          for (const t of tables) {
            await prisma.$executeRawUnsafe(`DROP TABLE IF EXISTS "${t}" CASCADE`);
          }
          for (const ty of ["SchemeType", "IngestionStatus"]) {
            await prisma.$executeRawUnsafe(`DROP TYPE IF EXISTS "${ty}"`);
          }
          console.log("Dropped any partial tables and types.");
          await prisma.$disconnect();
          EOF
          node ./recovery.mjs
          rm -f ./recovery.mjs
          pnpm exec prisma migrate resolve --rolled-back 20260730160708_init || echo "Already resolved, continuing."

      # Deliberately uses `prisma migrate deploy` only — this applies already-committed,
      # already-reviewed migrations. It never generates new migrations and never runs
      # `migrate reset` or a destructive `db push` against production.
      - name: Apply migrations
        working-directory: packages/database
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: pnpm exec prisma migrate deploy

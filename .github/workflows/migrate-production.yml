name: Apply Production Migrations

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm you want to run prisma migrate deploy against production'
        type: string
        required: true

concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    name: prisma migrate deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Confirm intent
        run: |
          if [ "${{ inputs.confirm }}" != "deploy" ]; then
            echo "Confirmation input did not match 'deploy'. Aborting without running migrations."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: TEMP DEBUG drop stale bootstrap-probe artifact
        working-directory: packages/database
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: |
          cat > ./debug-drop-stale.mjs <<'EOF'
          import { PrismaClient } from "./generated/client/index.js";
          const prisma = new PrismaClient();
          await prisma.$executeRawUnsafe("DROP TABLE IF EXISTS _permission_probe_app");
          await prisma.$executeRawUnsafe("DROP TABLE IF EXISTS _permission_probe_ingestor");
          const rows = await prisma.$queryRawUnsafe(
            "SELECT table_schema, table_name FROM information_schema.tables WHERE table_schema NOT IN ('crdb_internal','information_schema','pg_catalog','pg_extension')"
          );
          console.log(JSON.stringify(rows, null, 2));
          await prisma.$disconnect();
          EOF
          node ./debug-drop-stale.mjs
          rm -f ./debug-drop-stale.mjs

      # Deliberately uses `prisma migrate deploy` only — this applies already-committed,
      # already-reviewed migrations. It never generates new migrations and never runs
      # `migrate reset` or a destructive `db push` against production.
      - name: Apply migrations
        working-directory: packages/database
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: pnpm exec prisma migrate deploy
